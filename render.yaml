services:
  # Backend API Service
  - type: web
    name: seamless-auth-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run prisma:generate && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seamless-auth-db
          property: connectionString
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health

  # Frontend Web Service
  - type: web
    name: seamless-auth-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: seamless-auth-db
    databaseName: seamless_auth
    plan: free
    region: oregon
